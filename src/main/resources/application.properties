spring.application.name=clausevault
nearai.api-key=${NEARAI_API_KEY}
nearai.base-url=https://cloud-api.near.ai/v1
nearai.model=Qwen/Qwen3-VL-30B-A3B-Instruct

# Contract uploads (default is 1MB).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Origins allowed to call /api from a browser (the Next.js dev server by default). Comma-separated.
clausevault.cors.allowed-origins=https://clausevault-ui.vercel.app/
